name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc + lint + test + vite build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      # 新结构守卫：ESLint / stylelint / 旧壳冻结 / tokens.css 与 tokens.json 一致（frontend-structure.md §8 P0）
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec vite build

  rust:
    name: Rust crates (cargo test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude volo

  src-tauri:
    # target/sidecar-vendor 由 src-tauri/build.rs 自建；pdf_render 有 Linux 回退。
    # 不带 custom-protocol feature 即 dev 模式（走 devUrl），不嵌入 dist。
    name: src-tauri (cargo test -p volo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p volo

  sidecars:
    name: Sidecar ${{ matrix.name }} (pytest)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mesh-vba
            sidecar: mesh-vba
            install: -e . pytest pytest-cov
          - name: tracksim
            sidecar: tracksim
            install: -e . pytest jsonschema
          # vpcal：跳过 Ceres 原生求解器的编译，运行时回退到 scipy。
          - name: vpcal (scipy)
            sidecar: vpcal
            install: . -C cmake.define.VPCAL_SKIP_SOLVER=ON pytest pytest-cov jsonschema
          # vpcal：FetchContent 源码编译 Eigen + Ceres + _vpcal_solver，覆盖原生求解器路径。
          - name: vpcal (ceres)
            sidecar: vpcal
            install: . pytest pytest-cov jsonschema
            require_cpp: true
    defaults:
      run:
        working-directory: sidecars/${{ matrix.sidecar }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1
      # 记录运行器 CPU：vpcal 手眼 PnP 用例在不同运行器上结果不一致，留作排查依据。
      - name: Runner CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\))' ; grep -o -w -E 'avx512f|avx2' /proc/cpuinfo | sort -u
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv ${{ matrix.install }}
      # tracksim 依赖的 pysdl3 在 import 时若找不到 SDL3 运行库，会匿名调 GitHub API 下载，
      # 共享运行器的出口 IP 常被限流（API rate limit exceeded）→ SDL 相关用例失败。
      # ubuntu-24.04 的 apt 没有 SDL3，所以这里带令牌预先下载一次、按 pysdl3 版本缓存，
      # 之后的 pytest 关掉下载与版本检查，测试本身不联网。
      - name: SDL3 binaries (tracksim)
        id: sdl3
        if: matrix.sidecar == 'tracksim'
        run: |
          echo "SDL_BINARY_PATH=$RUNNER_TEMP/sdl3-bin" >> "$GITHUB_ENV"
          echo "version=$(.venv/bin/python -c "import importlib.metadata as m; print(m.version('pysdl3'))")" >> "$GITHUB_OUTPUT"
      - if: matrix.sidecar == 'tracksim'
        id: sdl3-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sdl3-bin
          key: pysdl3-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdl3.outputs.version }}
      - if: matrix.sidecar == 'tracksim' && steps.sdl3-cache.outputs.cache-hit != 'true'
        env:
          SDL_GITHUB_TOKEN: ${{ github.token }}
          SDL_CHECK_VERSION: "0"
        run: |
          .venv/bin/python -c "import sdl3"
          # pysdl3 下载失败只打日志不抛错：这里自己确认库文件到位，免得到 pytest 才变成看不懂的失败。
          ls "$SDL_BINARY_PATH"/libSDL3*.so* "$SDL_BINARY_PATH"/metadata.json
      - if: matrix.sidecar == 'tracksim' && steps.sdl3-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sdl3-bin
          key: ${{ steps.sdl3-cache.outputs.cache-primary-key }}
      - if: matrix.sidecar == 'tracksim'
        run: |
          echo "SDL_DOWNLOAD_BINARIES=0" >> "$GITHUB_ENV"
          echo "SDL_CHECK_VERSION=0" >> "$GITHUB_ENV"
      # tests/conftest.py 把 src/ 插到 sys.path 最前，pytest 实际导入的是源码树而非
      # site-packages，所以把编译产物拷进 src/vpcal；再按同一导入路径断言原生模块
      # 可用（否则 C++ 用例会静默 skip、solver 回退 scipy）。
      - if: matrix.require_cpp
        run: |
          cp .venv/lib/python3.12/site-packages/vpcal/_vpcal_solver*.so src/vpcal/
          PYTHONPATH=src .venv/bin/python -c "import vpcal; from vpcal.core.solver import cpp_available; assert vpcal.__file__.startswith('$PWD/src/'), vpcal.__file__; assert cpp_available(), 'native solver not built'"
      - run: .venv/bin/python -m pytest -q -rs
